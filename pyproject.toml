[project]
name = "cteforge"
version = "0.0.1"
description = "Turn a team's trusted SQL into a library AI agents can search, reuse, and change safely."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "sqlglot==30.31.0",  # exact pin; upgrade deliberately (ADR 0012)
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "duckdb>=1.1,<2",
    "typer>=0.12,<1",
]

[project.scripts]
cteforge = "cteforge.cli.main:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "import-linter>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cteforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Layering — see CLAUDE.md "Architecture" and DESIGN §. Run: uv run lint-imports
[tool.importlinter]
root_package = "cteforge"

[[tool.importlinter.contracts]]
name = "Pure core is layered"
type = "layers"
layers = [
    "cteforge.services",
    "cteforge.compose | cteforge.trust",
    "cteforge.templating",
    "cteforge.parsing",
    "cteforge.domain",
]

[[tool.importlinter.contracts]]
name = "Core never imports adapters, services or entry points"
type = "forbidden"
source_modules = [
    "cteforge.domain", "cteforge.parsing", "cteforge.templating",
    "cteforge.compose", "cteforge.trust",
]
forbidden_modules = [
    "cteforge.warehouse", "cteforge.files", "cteforge.store", "cteforge.audit",
    "cteforge.services", "cteforge.cli", "cteforge.mcp", "cteforge.api",
]

[[tool.importlinter.contracts]]
name = "Adapters are independent of each other"
type = "independence"
modules = [
    "cteforge.warehouse", "cteforge.files", "cteforge.store", "cteforge.audit",
]

[[tool.importlinter.contracts]]
name = "Adapters import only domain"
type = "forbidden"
source_modules = [
    "cteforge.warehouse", "cteforge.files", "cteforge.store", "cteforge.audit",
]
forbidden_modules = [
    "cteforge.parsing", "cteforge.templating", "cteforge.compose", "cteforge.trust",
    "cteforge.services", "cteforge.cli", "cteforge.mcp", "cteforge.api",
]

[[tool.importlinter.contracts]]
name = "Entry points go through services only"
type = "forbidden"
allow_indirect_imports = true  # cli -> services -> warehouse is the intended path
source_modules = ["cteforge.cli", "cteforge.mcp", "cteforge.api"]
forbidden_modules = [
    "cteforge.parsing", "cteforge.templating", "cteforge.compose", "cteforge.trust",
    "cteforge.warehouse", "cteforge.files", "cteforge.store", "cteforge.audit",
]
