# Warehouse connection profiles (ADR 0020). Point CTEFORGE_CONNECTIONS at a copy of this
# file. Secrets are NEVER written here: name the environment variable that holds each one
# in `secrets_env` (driver parameter -> env var name). Inline secret-looking options
# (password, token, private_key, credentials, ...) are refused.
# Connect as a dedicated READ-ONLY role on every warehouse.
profiles:
  demo:
    dialect: duckdb
    options:
      path: warehouse.duckdb   # relative paths resolve next to this file
    max_rows: 10000

