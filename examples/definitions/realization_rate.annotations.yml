# What a person (or an LLM via propose_definition) says about the trusted query.
# Literal IDs come from: cteforge parse examples/queries/realization_rate.sql
id: realization_rate
title: Realization Rate (monthly, by region)
meaning: Share of booked revenue on won deals that has been collected as paid invoices.
keywords: [realization, collection rate, collected revenue, cash realization]
use_when: Finance questions about how much won revenue turned into cash.
dont_use_when: Pipeline or forecast questions — this only covers closed-won deals.
grain: one row per month per region
variables:
  - name: period
    type: date_range
    role: changeable
    literals: [closed_deals.L1, closed_deals.L2]
    description: Deal close date range (end exclusive).
  - name: won_statuses
    type: text_list
    role: fixed
    literals: [closed_deals.L3, closed_deals.L4]
    description: What counts as a won deal. Business logic — do not change.
  - name: regions
    type: text_list
    role: changeable
    literals: [deals_in_region.L1, deals_in_region.L2]
    allowed: [EMEA, NA, APAC, LATAM]
  - name: paid_status
    type: text
    role: fixed
    literals: [collected.L1]
    description: Only paid invoices count as collected.
