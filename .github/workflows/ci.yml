# CI: lint, unit + integration tests, the GUI, end-to-end tests, and the warehouse
# connectors against REAL database servers (service containers). Passwords below are
# throwaway values for ephemeral CI containers, not secrets.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"

jobs:
  python:
    name: Python — lint, unit, integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra postgres --extra clickhouse --extra mysql
      - run: uv run python examples/seed_warehouse.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run pytest -q -m "not e2e"

  web:
    name: GUI — typecheck, unit, build, e2e (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: uv run python examples/seed_warehouse.py
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Server end-to-end (demo + serve + MCP over HTTP and stdio)
        run: uv run pytest -q tests/e2e
      - name: Browser end-to-end (installed Google Chrome)
        run: npx playwright test
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7

  live-databases:
    name: Connectors against real Postgres, ClickHouse and MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-admin-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: admin
          CLICKHOUSE_PASSWORD: ci-admin-password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 30
          --ulimit nofile=262144:262144
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-admin-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-admin-password"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      CTEFORGE_TEST_POSTGRES_URL: postgresql://127.0.0.1:5432
      CTEFORGE_TEST_POSTGRES_ADMIN_USER: postgres
      CTEFORGE_TEST_POSTGRES_ADMIN_PASSWORD: ci-admin-password
      CTEFORGE_TEST_POSTGRES_PASSWORD: ci-readonly-password
      CTEFORGE_TEST_CLICKHOUSE_URL: http://127.0.0.1:8123
      CTEFORGE_TEST_CLICKHOUSE_ADMIN_USER: admin
      CTEFORGE_TEST_CLICKHOUSE_ADMIN_PASSWORD: ci-admin-password
      CTEFORGE_TEST_CLICKHOUSE_PASSWORD: ci-readonly-password
      CTEFORGE_TEST_MYSQL_URL: mysql://127.0.0.1:3306
      CTEFORGE_TEST_MYSQL_ADMIN_USER: root
      CTEFORGE_TEST_MYSQL_ADMIN_PASSWORD: ci-admin-password
      CTEFORGE_TEST_MYSQL_PASSWORD: ci-readonly-password
      CTEFORGE_TEST_MYSQL_VERIFY: "0"  # the image's self-signed certificate: encrypted, not verified
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra postgres --extra clickhouse --extra mysql
      - run: uv run python examples/seed_warehouse.py
      - name: Prepare Postgres (database, synthetic data, read-only role)
        run: uv run python tests/fixtures/postgres/live_setup.py
      - name: Prepare ClickHouse (database, synthetic traces, read-only user + profile)
        run: uv run python tests/fixtures/clickhouse/live_setup.py
      - name: Prepare MySQL (database, synthetic data, read-only user, write probe user)
        run: uv run python tests/fixtures/mysql/live_setup.py
      - name: Live connector tests (none may be skipped)
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -v -rs -p no:cacheprovider \
            tests/integration/test_postgres_live.py \
            tests/integration/test_clickhouse_live.py \
            tests/integration/test_mysql_live.py | tee live.txt
          if grep -qE "[0-9]+ skipped" live.txt; then
            echo "::error::live database tests were skipped"; exit 1
          fi
